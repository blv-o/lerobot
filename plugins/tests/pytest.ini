# Suite de los plugins UR. Configuración propia para no tocar la del fork.
# Por defecto solo corren los tests sin hardware, URSim ni medidas de temporización:
#                                              pytest plugins/tests
# Contra URSim (con plugins/ursim levantado):   pytest plugins/tests -m ursim
[pytest]
markers =
    ursim: necesita los dos URSim de plugins/ursim/docker-compose.yml levantados
    timing: mide temporización en el PC real; no forma parte de la suite por defecto
addopts = -m "not ursim and not timing"
